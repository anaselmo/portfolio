<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignacio Moya Montoro</title>
    <link rel="alternate" hreflang="es" href="https://anaselmo.dev/es/" />
    <link rel="alternate" hreflang="en" href="https://anaselmo.dev/en/" />
    <link rel="alternate" hreflang="x-default" href="https://anaselmo.dev/" />
    <script>
      // Spanish by default; English only if the visitor picked it.
      let saved = null;
      try {
        saved = localStorage.getItem("lang");
      } catch {}
      location.replace(saved === "en" ? "en/" : "es/");
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=es/" /></noscript>
  </head>
  <body>
    <a href="es/">Español</a> · <a href="en/" hreflang="en" lang="en">English</a>
  </body>
</html>
